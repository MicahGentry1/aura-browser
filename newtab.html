<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab - Aura Chromium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0d14;
      --card-bg: rgba(22, 28, 42, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --accent-hover: #818cf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Ambient Background Glows */
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      pointer-events: none;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
      top: -100px;
      left: -100px;
    }

    .orb-2 {
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
      bottom: -150px;
      right: -150px;
    }

    .orb-3 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 900px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
    }

    /* Header & Clock */
    .clock-container {
      text-align: center;
    }

    .clock-time {
      font-family: 'Outfit', sans-serif;
      font-size: 5rem;
      font-weight: 700;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 0.5rem;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .clock-date {
      font-size: 1.1rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .greeting {
      font-size: 1.25rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-top: 0.25rem;
    }

    /* Search Box */
    .search-wrapper {
      width: 100%;
      max-width: 680px;
      position: relative;
    }

    .search-bar {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 0.6rem 0.6rem 0.6rem 1.4rem;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-bar:focus-within {
      border-color: var(--accent);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 25px var(--accent-glow);
    }

    .search-engine-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 0.5rem 0.8rem;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-right: 0.8rem;
      transition: background 0.2s;
    }

    .search-engine-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 1.05rem;
      font-family: inherit;
    }

    .search-input::placeholder {
      color: #64748b;
    }

    .search-submit-btn {
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      border: none;
      color: #ffffff;
      width: 44px;
      height: 44px;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .search-submit-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    /* Speed Dial Shortcuts Grid */
    .shortcuts-title {
      width: 100%;
      max-width: 680px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: -1rem;
    }

    .shortcuts-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1.25rem;
      width: 100%;
      max-width: 680px;
    }

    .shortcut-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-main);
      backdrop-filter: blur(16px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .shortcut-card:hover {
      transform: translateY(-5px);
      border-color: rgba(99, 102, 241, 0.5);
      background: rgba(30, 41, 59, 0.8);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4), 0 0 15px var(--accent-glow);
    }

    .shortcut-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 700;
      color: #a5b4fc;
    }

    .shortcut-label {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* Chromium Engine Tag Footer */
    .engine-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.5rem 1.2rem;
      border-radius: 30px;
      font-size: 0.8rem;
      color: var(--text-muted);
      backdrop-filter: blur(10px);
      margin-top: 1rem;
    }

    .engine-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
  </style>
</head>

<body>
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="glow-orb orb-3"></div>

  <div class="container">
    <div class="clock-container">
      <div class="clock-time" id="clock">12:00</div>
      <div class="clock-date" id="date">Sunday, July 26</div>
      <div class="greeting" id="greeting">Welcome to Aura Chromium</div>
    </div>

    <div class="search-wrapper">
      <form id="searchForm" class="search-bar">
        <select id="engineSelect" class="search-engine-btn">
          <option value="google">Google</option>
          <option value="ddg">DuckDuckGo</option>
          <option value="bing">Bing</option>
          <option value="wikipedia">Wikipedia</option>
        </select>
        <input type="text" id="searchInput" class="search-input" placeholder="Search the web or enter URL..." autofocus
          autocomplete="off" />
        <button type="submit" class="search-submit-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </form>
    </div>

    <div class="shortcuts-title">Top Sites</div>

    <div class="shortcuts-grid" id="shortcutsGrid">
      <a href="https://google.com" class="shortcut-card">
        <div class="shortcut-icon" style="background: rgba(66, 133, 244, 0.15); color: #60a5fa;">G</div>
        <span class="shortcut-label">Google</span>
      </a>
      <a href="https://youtube.com" class="shortcut-card">
        <div class="shortcut-icon" style="background: rgba(239, 68, 68, 0.15); color: #f87171;">Y</div>
        <span class="shortcut-label">YouTube</span>
      </a>
      <a href="https://github.com" class="shortcut-card">
        <div class="shortcut-icon" style="background: rgba(255, 255, 255, 0.15); color: #f3f4f6;">Git</div>
        <span class="shortcut-label">GitHub</span>
      </a>
      <a href="https://wikipedia.org" class="shortcut-card">
        <div class="shortcut-icon" style="background: rgba(148, 163, 184, 0.15); color: #cbd5e1;">W</div>
        <span class="shortcut-label">Wikipedia</span>
      </a>
      <a href="https://reddit.com" class="shortcut-card">
        <div class="shortcut-icon" style="background: rgba(249, 115, 22, 0.15); color: #fb923c;">R</div>
        <span class="shortcut-label">Reddit</span>
      </a>
    </div>

    <div class="engine-badge">
      <div class="engine-dot"></div>
      Powered by Chromium Content & Blink Engine
    </div>
  </div>

  <script>
    // Live Clock & Greeting
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}`;

      const options = { weekday: 'long', month: 'long', day: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);

      const hour = now.getHours();
      let greetText = "Good Evening";
      if (hour < 12) greetText = "Good Morning";
      else if (hour < 18) greetText = "Good Afternoon";
      document.getElementById('greeting').textContent = `${greetText}, whoever you are`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Handle Search Form Submission
    document.getElementById('searchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const query = document.getElementById('searchInput').value.trim();
      const engine = document.getElementById('engineSelect').value;
      if (!query) return;

      let targetUrl = '';
      if (query.match(/^(https?:\/\/|[a-z0-9]+[a-z0-9-\.]*\.[a-z]{2,})/i)) {
        targetUrl = query.startsWith('http') ? query : 'https://' + query;
      } else {
        if (engine === 'google') targetUrl = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
        else if (engine === 'ddg') targetUrl = `https://duckduckgo.com/?q=${encodeURIComponent(query)}`;
        else if (engine === 'bing') targetUrl = `https://www.bing.com/search?q=${encodeURIComponent(query)}`;
        else if (engine === 'wikipedia') targetUrl = `https://en.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(query)}`;
      }

      window.location.href = targetUrl;
    });
  </script>
</body>

</html>
